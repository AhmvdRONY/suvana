<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — SUVANA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="shop">
    <div class="grain"></div>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    <div class="loader" id="loader">
      <div class="loader-mark">SUVANA</div>
      <div class="loader-line"><span></span></div>
    </div>
    <header id="site-header"></header>
    <nav id="mobile-nav"></nav>
    <div class="page-wrap">
      <section class="shop-hero">
        <p class="kicker">SUVANA</p>
        <h1 class="display" data-i18n="shop.title"></h1>
        <div class="filters" id="shop-filters">
          <button class="chip hoverable is-on" data-cat="all" data-i18n="shop.all"></button>
          <button class="chip hoverable" data-cat="hoodies" data-i18n="shop.hoodies"></button>
          <button class="chip hoverable" data-cat="sets" data-i18n="shop.sets"></button>
          <button class="chip hoverable" data-cat="tshirts" data-i18n="shop.tshirts"></button>
          <button class="chip hoverable" data-cat="pants" data-i18n="shop.pants"></button>
          <button class="chip hoverable" data-cat="jackets" data-i18n="shop.jackets"></button>
          <label class="sort-wrap">
            <span data-i18n="shop.sort"></span>
            <select id="shop-sort">
              <option value="featured" data-i18n="shop.featured"></option>
              <option value="newest" data-i18n="shop.newest"></option>
              <option value="low" data-i18n="shop.low"></option>
              <option value="high" data-i18n="shop.high"></option>
            </select>
          </label>
        </div>
        <p class="kicker" id="shop-count"></p>
      </section>
      <section class="section" style="padding-top: 0">
        <div class="product-grid" id="shop-grid"></div>
      </section>
      <footer id="site-footer"></footer>
    </div>
    <div id="cart-root"></div>
    <div id="search-root"></div>
    <div id="qv-root"></div>
    <div class="toast" id="toast"></div>
    <script src="js/translations.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
