<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — SUVANA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="product">
    <div class="grain"></div>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    <div class="loader" id="loader">
      <div class="loader-mark">SUVANA</div>
      <div class="loader-line"><span></span></div>
    </div>
    <header id="site-header"></header>
    <nav id="mobile-nav"></nav>
    <div class="page-wrap">
      <article class="pdp">
        <div>
          <div class="gallery-main">
            <img id="pdp-main" alt="SUVANA product" />
          </div>
          <div class="thumbs" id="pdp-thumbs"></div>
        </div>
        <div>
          <h1 id="pdp-name"></h1>
          <p id="pdp-price" class="product-price" style="font-size: 18px"></p>
          <p id="pdp-desc"></p>
          <p class="kicker" data-i18n="product.color"></p>
          <p id="pdp-color-label" class="product-price"></p>
          <div class="color-row" id="pdp-colors"></div>
          <p class="kicker" data-i18n="product.size"></p>
          <div class="size-row" id="pdp-sizes"></div>
          <p class="kicker" data-i18n="product.qty"></p>
          <div class="qty-row">
            <button class="hoverable" id="qty-minus">−</button>
            <span id="pdp-qty">1</span>
            <button class="hoverable" id="qty-plus">+</button>
          </div>
          <div class="pdp-actions">
            <button class="btn btn-fill hoverable" id="pdp-add" data-i18n="product.addToCart"></button>
            <button class="btn hoverable" id="pdp-buy" data-i18n="product.buyNow"></button>
            <button class="btn btn-ghost hoverable" id="pdp-wa" data-i18n="product.whatsapp"></button>
          </div>
          <p class="product-price" style="margin-top: 24px" data-i18n="product.shipping"></p>
        </div>
      </article>
      <footer id="site-footer"></footer>
    </div>
    <div id="cart-root"></div>
    <div id="search-root"></div>
    <div id="qv-root"></div>
    <div class="toast" id="toast"></div>
    <script src="js/translations.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
