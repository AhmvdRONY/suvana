<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Size Guide — SUVANA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="size">
    <div class="grain"></div>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    <div class="loader" id="loader">
      <div class="loader-mark">SUVANA</div>
      <div class="loader-line"><span></span></div>
    </div>
    <header id="site-header"></header>
    <nav id="mobile-nav"></nav>
    <div class="page-wrap">
      <section class="page-plain">
        <h1 class="display" data-i18n="size.title"></h1>
        <p class="lede" data-i18n="size.lead"></p>
        <table class="size-table">
          <thead>
            <tr>
              <th data-i18n="size.size"></th>
              <th data-i18n="size.chest"></th>
              <th data-i18n="size.length"></th>
            </tr>
          </thead>
          <tbody>
            <tr><td>S</td><td>58</td><td>68</td></tr>
            <tr><td>M</td><td>62</td><td>70</td></tr>
            <tr><td>L</td><td>66</td><td>72</td></tr>
            <tr><td>XL</td><td>70</td><td>74</td></tr>
            <tr><td>XXL</td><td>74</td><td>76</td></tr>
          </tbody>
        </table>
        <p data-i18n="size.note"></p>
      </section>
      <footer id="site-footer"></footer>
    </div>
    <div id="cart-root"></div>
    <div id="search-root"></div>
    <div id="qv-root"></div>
    <div class="toast" id="toast"></div>
    <script src="js/translations.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
